name: Phase 2 full verification on Windows

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase2-windows:
    name: Phase 2 verification (Windows)
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org/"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Reject private or non-public npm registry references
        run: node scripts/check-public-registry.mjs
      - name: Reject build products and private material in source checkout
        run: node scripts/check-source-cleanliness.mjs --allow-root-vcs-metadata
      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/
      - name: Run security, Phase-1 regression and Phase-2 unit checks
        run: npm test
      - name: Check TypeScript and build frontend
        run: npm run build
      - name: Run responsive, accessibility and visual browser checks
        shell: pwsh
        run: |
          $env:S9LAB_BROWSER_PATH = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (!(Test-Path $env:S9LAB_BROWSER_PATH)) { $env:S9LAB_BROWSER_PATH = "C:\Program Files\Microsoft\Edge\Application\msedge.exe" }
          npm run test:browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run browser performance harness
        shell: pwsh
        run: |
          $env:S9LAB_BROWSER_PATH = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (!(Test-Path $env:S9LAB_BROWSER_PATH)) { $env:S9LAB_BROWSER_PATH = "C:\Program Files\Microsoft\Edge\Application\msedge.exe" }
          $env:S9LAB_PERFORMANCE_OUTPUT = "$env:RUNNER_TEMP\phase2-performance-browser.json"
          npm run test:performance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Check Rust project
        working-directory: src-tauri
        run: cargo check --locked
      - name: Run Clippy with warnings denied
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Phase-1 Windows regressions explicitly
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --locked crash_recovery_never_leaves_a_mixed_revision -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked rejects_existing_hardlinks -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked classifies_verified_windows_junctions_with_the_stable_reparse_error -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked rejects_windows_directory_junctions_after_verified_fixture_creation -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked accepts_path_at_the_available_relative_boundary -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked rejects_path_one_unit_beyond_the_available_relative_boundary -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked operation_plan_preflight_enforces_the_real_root_budget_before_journaling -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked phase1_transaction_demo -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run complete parallel Rust regression suite three times
        working-directory: src-tauri
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "Complete parallel Rust regression run $_/3"
            cargo test --locked -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build unsigned Tauri Windows bundle for local verification only
        run: npm run tauri:build
      - name: Confirm publication and signing are disabled
        shell: pwsh
        run: Write-Host "Phase 2 verifies source and an unsigned local NSIS bundle only. It publishes no artifact and uses no signing secret."
