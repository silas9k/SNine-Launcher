name: SNine Launcher Phase 1 Windows Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase1-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Registry guard
        run: node scripts/check-public-registry.mjs

      - name: Source cleanliness guard
        run: node scripts/check-source-cleanliness.mjs --allow-root-vcs-metadata

      - name: Install frontend dependencies
        run: npm ci

      - name: Full frontend and security tests
        run: npm test

      - name: Production frontend build
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust full tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Crash recovery regression
        working-directory: src-tauri
        run: cargo test --locked crash_recovery_never_leaves_a_mixed_revision

      - name: Hardlink rejection regression
        working-directory: src-tauri
        run: cargo test --locked rejects_existing_hardlinks

      - name: Windows junction classification
        working-directory: src-tauri
        run: cargo test --locked classifies_verified_windows_junctions_with_the_stable_reparse_error

      - name: Windows junction rejection
        working-directory: src-tauri
        run: cargo test --locked rejects_windows_directory_junctions_after_verified_fixture_creation

      - name: Path boundary acceptance
        working-directory: src-tauri
        run: cargo test --locked accepts_path_at_the_available_relative_boundary

      - name: Path boundary rejection
        working-directory: src-tauri
        run: cargo test --locked rejects_path_one_unit_beyond_the_available_relative_boundary

      - name: Operation path budget regression
        working-directory: src-tauri
        run: cargo test --locked operation_plan_preflight_enforces_the_real_root_budget_before_journaling

      - name: Phase 1 transaction demo
        working-directory: src-tauri
        run: cargo test --locked phase1_transaction_demo
