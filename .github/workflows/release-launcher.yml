name: Verify S9Lab Launcher source

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Source verification (Windows)
    runs-on: windows-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org/"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Reject private or non-public npm registry references
        run: node scripts/check-public-registry.mjs

      - name: Reject build products and private material in source checkout
        run: node scripts/check-source-cleanliness.mjs --allow-root-vcs-metadata

      - name: Install frontend dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Run security, contract and Phase-1 checks
        run: npm test

      - name: Check TypeScript and build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust project
        working-directory: src-tauri
        run: cargo check --locked

      - name: Run Clippy with warnings denied
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run complete parallel Rust tests three times
        working-directory: src-tauri
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            Write-Host "Complete parallel Rust regression run $_/3"
            cargo test --locked -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publication intentionally disabled
        shell: pwsh
        run: Write-Host "This workflow has read-only permissions, uses no signing secrets, uploads no artifacts and publishes no release."
