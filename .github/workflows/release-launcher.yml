name: SNine Launcher Windows Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-verification:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Registry guard
        run: node scripts/check-public-registry.mjs

      - name: Source cleanliness guard
        run: node scripts/check-source-cleanliness.mjs --allow-root-vcs-metadata

      - name: Install dependencies
        run: npm ci

      - name: Main verification
        run: npm test

      - name: Browser verification
        run: npm run test:browser

      - name: Performance verification
        run: npm run test:performance

      - name: Phase 10 verification
        run: node scripts/check-phase10-windows-release.mjs

      - name: Build unsigned diagnostic NSIS
        run: npm run tauri:build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: TEST-NSIS-LIFECYCLE.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installers = @(
            Get-ChildItem `
              -LiteralPath ".\src-tauri\target\release\bundle\nsis" `
              -Filter "*.exe" `
              -File
          )

          if ($installers.Count -ne 1) {
            throw "Genau ein NSIS-Installer erwartet; gefunden: $($installers.Count)"
          }

          $installer = $installers[0]
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash

          .\TEST-NSIS-LIFECYCLE.ps1 `
            -InstallerPath $installer.FullName `
            -ExpectedSha256 $hash `
            -AllowUnsignedDiagnosticInstaller
