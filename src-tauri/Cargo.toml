[package]
name = "s9lab-launcher"
version = "1.0.9"
description = "Official SNine Minecraft Launcher"
repository = "https://github.com/silas9k/S9Lab-Launcher"
homepage = "https://github.com/silas9k/S9Lab-Launcher"
authors = ["SNine"]
edition = "2021"
license = "All-Rights-Reserved"

[lib]
name = "s9lab_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
sha2 = "0.10"
discord-rich-presence = "1.1.0"
base64 = "0.22"
tauri = { version = "=2.11.2", features = [] }
tauri-plugin-opener = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "fs", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
sha1 = "0.10"
hex = "0.4"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
regex = "1"
opener = "0.7"
ring = "=0.17.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Keep `tauri dev` responsive while making launch-time hashing, ZIP inspection,
# JSON parsing and path validation substantially faster than Cargo's default
# fully-unoptimized dev profile.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
